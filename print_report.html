<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bandit REINFORCE Report</title>
    <!-- GitHub Markdown CSS for beautiful styling -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
            background-color: white;
        }
        @media print {
            body { padding: 0; }
            .markdown-body { padding: 0; }
        }
    </style>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- MathJax for LaTeX equations -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="markdown-body">
    <div id="content"></div>
    <script>
        // Fetch the markdown file locally
        fetch('Multi_Arm_Bandit_Experiments_URB.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
                // Tell MathJax to typeset the newly added equations
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            });
    </script>
</body>
</html>
